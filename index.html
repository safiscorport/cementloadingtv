<script src="app.js"></script>
<script>
async function loadWeather(){
    try{
        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=10.3157&longitude=123.8854&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=precipitation_probability&timezone=Asia%2FManila"
        );
        const data = await response.json();

        const temp = data.current.temperature_2m;
        const humidity = data.current.relative_humidity_2m;
        const wind = data.current.wind_speed_10m;
        const rain = data.hourly.precipitation_probability[0];
        const now = new Date();
        const time = now.toLocaleTimeString('en-PH',{ hour:'2-digit', minute:'2-digit' });

        document.getElementById("weatherTicker").innerHTML =
            "🌤 CEBU SAN FERNANDO | 🌡 "+temp+"°C | 💧 Humidity "+humidity+
            "% | 🌧 Rain "+rain+
            "% | 💨 Wind "+wind+
            " km/h | 🕒 Updated "+time+
            " |";
    }catch(e){
        document.getElementById("weatherTicker").innerHTML = "Unable to load weather.";
    }
}

loadWeather();
setInterval(loadWeather, 3600000);

const DASHBOARD_DURATION_MS = 3 * 60 * 1000;
const HISTORY_DURATION_MS   = 3 * 60 * 1000;

const CEMENT_HISTORY_TOTALS = {
  2020: 22643900,
  2021: 17720877,
  2022: 13217702,
  2023: 13814103,
  2024: 15050541,
  2025: 16616958,
  2026: null
};

let LIVE_2026_TOTAL = null;
let LIVE_2026_UPDATED_AT = null;
let manualOverride = false;

function get2026Total(){
  return Number.isFinite(LIVE_2026_TOTAL) ? LIVE_2026_TOTAL : null;
}

async function loadLive2026(){
  try{
    const response = await fetch("data.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if(!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    let total2026 = null;

    if(data.monthly_total && data.monthly_total.y2026 !== undefined){
      const n = Number(String(data.monthly_total.y2026).replace(/,/g,""));
      if(Number.isFinite(n) && n >= 0){
        total2026 = n;
      }
    }

    if(total2026 === null && Array.isArray(data.monthly)){
      const calculated = data.monthly.reduce((sum,row)=>{
        const n = Number(String(row.y2026 ?? 0).replace(/,/g,""));
        return sum + (Number.isFinite(n) ? n : 0);
      },0);
      total2026 = calculated;
    }

    if(total2026 !== null){
      const changed = LIVE_2026_TOTAL !== total2026;
      LIVE_2026_TOTAL = total2026;
      LIVE_2026_UPDATED_AT = data.updated_at || null;
      CEMENT_HISTORY_TOTALS[2026] = total2026;

      if(changed || document.getElementById("historyScreen")?.classList.contains("show")){
        renderHistoryTotals();
      }
    }
  }catch(error){
    console.warn("[Dashboard 2] Unable to load live 2026 data:", error);
  }
}

window.updateHistoryFromDashboard = function(){
  const live = get2026Total();
  CEMENT_HISTORY_TOTALS[2026] = live;
  const historyScreen = document.getElementById("historyScreen");
  if (historyScreen && historyScreen.classList.contains("show")) {
    renderHistoryTotals();
  }
};

function formatMT(v){
  return v == null ? "—" : Math.round(v).toLocaleString("en-PH");
}

function updateHistoryClock(){
  const now = new Date();
  document.getElementById("historyDate").textContent =
    now.toLocaleDateString("en-PH",{weekday:"short",year:"numeric",month:"short",day:"2-digit"});
  document.getElementById("historyTime").textContent =
    now.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(updateHistoryClock,1000);

function drawAnnualChart(){
  const svg = document.getElementById("annualChart");
  const data = Object.entries(CEMENT_HISTORY_TOTALS).map(([year,value])=>({year,value}));
  data[6].value = get2026Total();

  const W=1000,H=560,L=78,R=34,T=48,B=78;
  const plotW=W-L-R, plotH=H-T-B;
  const vals=data.map(d=>d.value).filter(v=>Number.isFinite(v));
  const maxRaw=Math.max(...vals,1);
  const max=Math.ceil(maxRaw/5000000)*5000000;
  const step=plotW/data.length;
  const barW=step*.52;

  const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
  let out = `
    <defs>
      <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8eeaff" stop-opacity=".98"/>
        <stop offset="52%" stop-color="#31c5f4" stop-opacity=".82"/>
        <stop offset="100%" stop-color="#147ba8" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="barLive" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd27a" stop-opacity="1"/>
        <stop offset="55%" stop-color="#f4a94b" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#a65e1e" stop-opacity=".62"/>
      </linearGradient>
      <filter id="barGlow" x="-40%" y="-30%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  `;

  for(let i=0;i<=5;i++){
    const y=T+plotH-(plotH*i/5);
    const value=max*i/5;
    out += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="rgba(142,222,255,.10)" stroke-width="${i===0?1.5:1}" />`;
    out += `<text x="${L-14}" y="${y+5}" text-anchor="end" fill="rgba(224,244,252,.42)" font-size="15" font-family="Segoe UI,Arial">${value===0?"0":Math.round(value/1000000)+"M"}</text>`;
  }

  out += `<line x1="${L}" y1="${T+plotH}" x2="${W-R}" y2="${T+plotH}" stroke="rgba(145,224,255,.24)" stroke-width="2"/>`;

  data.forEach((d,i)=>{
    const x=L+i*step+(step-barW)/2;
    const known=Number.isFinite(d.value);
    const h=known ? (d.value/max)*plotH : 0;
    const y=T+plotH-h;
    const isLive=d.year==2026;

    if(known){
      out += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="10"
        fill="${isLive?'url(#barLive)':'url(#barGrad)'}"
        opacity="${isLive?.96:.88}"
        filter="${isLive?'url(#barGlow)':''}" />`;
      out += `<rect x="${x+3}" y="${y+3}" width="${Math.max(0,barW-6)}" height="2" rx="1" fill="rgba(255,255,255,.42)" />`;
      out += `<text x="${x+barW/2}" y="${Math.max(y-13,24)}" text-anchor="middle" fill="${isLive?'#ffd88c':'#e8faff'}" font-size="16" font-weight="800" font-family="Segoe UI,Arial">${formatMT(d.value)}</text>`;
    }else{
      out += `<rect x="${x}" y="${T+plotH-5}" width="${barW}" height="5" rx="3" fill="rgba(255,255,255,.13)" />`;
      out += `<text x="${x+barW/2}" y="${T+plotH-18}" text-anchor="middle" fill="rgba(255,255,255,.42)" font-size="13" font-weight="700" font-family="Segoe UI,Arial">LIVE</text>`;
    }

    const labelFill=isLive?"rgba(255,179,75,.12)":"rgba(105,216,255,.07)";
    const labelStroke=isLive?"rgba(255,190,95,.28)":"rgba(105,216,255,.13)";
    out += `<rect x="${x+barW*.16}" y="${H-53}" width="${barW*.68}" height="30" rx="15" fill="${labelFill}" stroke="${labelStroke}" />`;
    out += `<text x="${x+barW/2}" y="${H-33}" text-anchor="middle" fill="${isLive?'#ffd28a':'#d9f4fc'}" font-size="16" font-weight="850" font-family="Segoe UI,Arial">${esc(d.year)}</text>`;
  });

  const points=data.filter(d=>Number.isFinite(d.value)).map(d=>{
    const i=data.indexOf(d);
    const x=L+i*step+step/2;
    const y=T+plotH-(d.value/max)*plotH;
    return `${x},${y}`;
  }).join(" ");
  if(points){
    out += `<polyline points="${points}" fill="none" stroke="rgba(155,232,255,.30)" stroke-width="2" stroke-dasharray="5 8" />`;
  }

  svg.innerHTML=out;
}

function renderHistoryTotals(){
  CEMENT_HISTORY_TOTALS[2026]=get2026Total();
  const entries=Object.entries(CEMENT_HISTORY_TOTALS);
  const tbody=document.getElementById("historyTotals");
  tbody.innerHTML=entries.map(([year,value])=>
    `<tr class="${year==2026?'current':''}">
      <td>${year}</td><td>${formatMT(value)}</td>
    </tr>`).join("");

  const completed=entries.filter(([year,value])=>Number(year)<2026 && Number.isFinite(value));
  const avg=completed.length ? completed.reduce((s,[,v])=>s+v,0)/completed.length : null;
  const peak=completed.length ? completed.reduce((best,item)=>item[1]>best[1]?item:best,completed[0]) : null;
  const latest=get2026Total();

  const avgEl=document.getElementById("historyAvg");
  const peakEl=document.getElementById("historyPeak");
  const latestEl=document.getElementById("historyLatest");
  if(avgEl) avgEl.textContent=formatMT(avg);
  if(peakEl) peakEl.textContent=peak ? `${peak[0]} • ${formatMT(peak[1])}` : "—";
  if(latestEl) latestEl.textContent=latest==null ? "LIVE" : formatMT(latest);

  drawAnnualChart();
}

function showHistoryScreen(){
  renderHistoryTotals();
  document.getElementById("historyScreen").classList.add("show");
  document.getElementById("btnDash1").classList.remove("active");
  document.getElementById("btnDash2").classList.add("active");
  document.getElementById("hBtnDash1").classList.remove("active");
  document.getElementById("hBtnDash2").classList.add("active");
}
function hideHistoryScreen(){
  document.getElementById("historyScreen").classList.remove("show");
  document.getElementById("btnDash1").classList.add("active");
  document.getElementById("btnDash2").classList.remove("active");
  document.getElementById("hBtnDash1").classList.add("active");
  document.getElementById("hBtnDash2").classList.remove("active");
}

function manualSwitchDashboard(target){
  manualOverride = true; // User manually clicked, so pause auto rotation
  clearTimeout(rotationTimer);
  clearTimeout(historyTimer);
  
  if(target === 1){
    hideHistoryScreen();
  } else {
    showHistoryScreen();
  }
}

let rotationTimer=null, historyTimer=null;
function startRotation(){
  if(manualOverride) return;
  clearTimeout(rotationTimer); 
  clearTimeout(historyTimer);
  
  // Start on Dashboard 1
  hideHistoryScreen();
  
  // Wait for Dashboard duration, then switch to Dashboard 2 (History)
  rotationTimer = setTimeout(()=>{
    if(manualOverride) return;
    showHistoryScreen();
    const started = Date.now();
    
    function tick(){
      if(manualOverride) return;
      const elapsed = Date.now() - started;
      const remain = Math.max(0, HISTORY_DURATION_MS - elapsed);
      const pct = Math.min(100, (elapsed / HISTORY_DURATION_MS) * 100);
      
      const bar = document.getElementById("historyProgressBar");
      const countdown = document.getElementById("historyCountdown");
      if(bar) bar.style.width = pct + "%";
      if(countdown) countdown.textContent = "RETURNING TO LIVE DASHBOARD • " + Math.ceil(remain / 1000) + "s";
      
      if(remain > 0){
        historyTimer = setTimeout(tick, 250);
      } else {
        // Time's up for Dashboard 2, loop back to Dashboard 1
        startRotation();
      }
    }
    tick();
  }, DASHBOARD_DURATION_MS);
}

updateHistoryClock();
loadLive2026();
setInterval(loadLive2026, 10000);
startRotation();
</script>
