<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Monitor</title>

<style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ width:100%; height:100%; overflow:hidden; background:#000; }

    /* Logo Styling */
    .logo-container { position: absolute; top: 1px; left: 1px; z-index: 10001; }
    .logo-container img { height: 50px; width: auto; }

    /* Ticker Styles */
    .ticker-wrap { width: 100%; background: #fff; color: blue; padding: 5px 0; overflow: hidden; white-space: nowrap; position: absolute; top: 0; z-index: 10000; font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; }
    .ticker-content { display: inline-block; animation: ticker-move 20s linear infinite; }
    @keyframes ticker-move { 0% { transform: translate(100%, 0); } 100% { transform: translate(-100%, 0); } }

    /* Live Clock UI */
    .live-container { display: flex; align-items: center; gap: 15px; color: #ff0000; font-weight: bold; font-size: 12px; margin-right: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 3px; }
    .blink-dot { width: 10px; height: 10px; background-color: #ff0000; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    #clock { color: #fff; font-family: monospace; font-size: 14px; }

    /* Single Fullscreen Wide Dashboard Image Layer */
    .dashboard-image-layer { 
        position: absolute; 
        top: 30px; 
        left: 0; 
        width: 100%; 
        height: calc(100% - 80px); 
        background-size: 100% 100%; 
        background-repeat: no-repeat; 
        background-position: center; 
        background-color: #000;
        z-index: 2; 
    }

    /* UI Overlay */
    .ui-container { position:absolute; top:40px; right:10px; z-index:9999; display: flex; align-items: center; gap: 10px; }
    .controls-bar { display: flex; gap: 5px; }
    button { padding: 5px 10px; cursor: pointer; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #555; border-radius: 3px; font-size: 12px; }
    button:hover { background: #444; }

    /*================ WEATHER TICKER ================*/
    .weather-bar{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        height:50px;
        background:#003b8e;
        color:#fff;
        display:flex;
        align-items:center;
        overflow:hidden;
        z-index:99999;
        border-top:3px solid #00bfff;
    }

    .weather-title{
        background:#d00000;
        padding:0 20px;
        height:100%;
        display:flex;
        align-items:center;
        font-weight:bold;
        white-space:nowrap;
    }

    .ticker{
        flex:1;
        overflow:hidden;
    }

    .weather-ticker-content{
        display:inline-block;
        white-space:nowrap;
        padding-left:100%;
        animation:scroll 40s linear infinite;
        font-weight:bold;
    }

    @keyframes scroll{
        0%{ transform:translateX(0); }
        100%{ transform:translateX(-100%); }
    }
</style>
</head>

<body>

<div class="ticker-wrap"><div class="ticker-content">SAFISCOR • SAN FERNANDO INTEGRATED SERVICES AND EQUIPMENT CORPORATION • CEMENT LOADING DASHBOARD • LIVE DATA SYNCHRONIZATION ACTIVE • REAL-TIME MONITORING ENABLED</div></div>

<div class="logo-container"><img src="logo.png" alt="SAFISCOR Logo"></div>

<div class="ui-container">
    <div class="live-container"><div class="blink-dot"></div> LIVE <span id="clock">00:00:00</span></div>
    <div class="controls-bar">
        <button onclick="changeZoom(0.1)">Zoom +</button>
        <button onclick="changeZoom(-0.1)">Zoom -</button>
        <button onclick="resetZoom()">Reset</button>
        <button onclick="toggleFullScreen()">Fullscreen</button>
    </div>
</div>

<!-- Single Dashboard Image Layer -->
<div id="imgLayer" class="dashboard-image-layer"></div>

<script>
// Clock
function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
setInterval(updateClock, 1000);
updateClock();

let currentZoom = 1;
const imgLayer = document.getElementById("imgLayer");

function changeZoom(currentDelta) { 
    currentZoom = Math.max(0.5, currentZoom + currentDelta); 
    applyZoom(); 
}
function resetZoom() { 
    currentZoom = 1; 
    applyZoom(); 
}
function applyZoom() { 
    imgLayer.style.transform = `scale(${currentZoom})`; 
}
function toggleFullScreen() { 
    if (!document.fullscreenElement) document.documentElement.requestFullscreen(); 
    else document.exitFullscreen(); 
}

// Load and auto-refresh dashboard1.png every 3 minutes (180,000 ms)
function refreshDashboard() {
    imgLayer.style.backgroundImage = `url('dashboard1.png?v=${Date.now()}')`;
}

refreshDashboard();
setInterval(refreshDashboard, 180000);

// Weather Ticker Logic
async function loadWeather(){
    try{
        const response=await fetch("https://api.open-meteo.com/v1/forecast?latitude=10.3157&longitude=123.8854&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=precipitation_probability&timezone=Asia%2FManila");
        const data=await response.json();

        const temp=data.current.temperature_2m;
        const humidity=data.current.relative_humidity_2m;
        const wind=data.current.wind_speed_10m;
        const rain=data.hourly.precipitation_probability[0];
        const now=new Date();
        const time=now.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});

        document.getElementById("weatherTicker").innerHTML = "🌤 CEBU SAN FERNANDO | 🌡 "+temp+"°C | 💧 Humidity "+humidity+"% | 🌧 Rain "+rain+"% | 💨 Wind "+wind+" km/h | 🕒 Updated "+time+" |";
    }catch(e){
        document.getElementById("weatherTicker").innerHTML="Unable to load weather.";
    }
}

loadWeather();
setInterval(loadWeather,3600000);
</script>

<div class="weather-bar">
    <div class="weather-title">🌤 WEATHER</div>
    <div class="ticker">
        <div class="weather-ticker-content" id="weatherTicker">Loading weather...</div>
    </div>
</div>

</body>
</html>
